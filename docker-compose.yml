      - DATABASE_URL=postgresql://postgres.whthiqtfnnxdoovlivlx:N9cmjcvw7eV4M7S7@aws-1-ap-south-1.pooler.supabase.com:5432/postgres
      - DIRECT_URL=postgresql://postgres.whthiqtfnnxdoovlivlx:N9cmjcvw7eV4M7S7@aws-1-ap-south-1.pooler.supabase.com:5432/postgres
